<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои анализы</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0612;--card:#140d22;--ink:#e9f7ff;--mute:#8f86b3;--line:#3a2468;--acc:#00f0ff;--pink:#ff2bd6;--yel:#fcee0a;--accsoft:#1d1240;--band:rgba(255,43,214,.16);--warn:#3a3005;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Chakra Petch',system-ui,sans-serif}
body{background:repeating-linear-gradient(0deg,rgba(0,240,255,.035) 0 1px,transparent 1px 4px),radial-gradient(120% 60% at 100% 0,rgba(255,43,214,.18),transparent 60%),radial-gradient(100% 50% at 0 100%,rgba(0,240,255,.12),transparent 60%),var(--bg);background-attachment:fixed}
.app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:28px;margin:8px 0 2px;text-transform:uppercase;letter-spacing:.06em;text-shadow:2px 0 var(--pink),-2px 0 var(--acc)}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.btn{width:100%;border:0;border-radius:0;padding:14px;font:inherit;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--yel);color:#0a0612;cursor:pointer;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));box-shadow:0 0 18px rgba(252,238,10,.35)}
.btn:hover{background:var(--acc)}
.btn.ghost{background:var(--accsoft);color:var(--acc)}
.btn:focus-visible,.row:focus-visible,input:focus-visible,.pt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.list{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:0;margin-top:16px;overflow:hidden;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.head,.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:8px;padding:12px 14px;align-items:center}
.head{font-size:12px;color:var(--acc);letter-spacing:.1em;border-bottom:1px solid var(--line)}
.row:hover{background:var(--accsoft)}
.row{border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.row:last-child{border-bottom:0}
.name{font-weight:500}.name small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.old{color:var(--mute)}.new{font-weight:700;color:var(--acc);text-shadow:0 0 8px rgba(0,240,255,.6)}
.d{font-size:13px}.d b{font-weight:700}
.back{background:none;border:0;color:var(--pink);font:inherit;font-weight:700;letter-spacing:.06em;padding:8px 0;cursor:pointer}
.drop{display:block;border:2px dashed var(--pink);border-radius:0;padding:28px 16px;text-align:center;color:var(--mute);cursor:pointer;background:var(--card)}
.drop img{max-width:100%;max-height:220px;border-radius:0;border:1px solid var(--acc);display:block;margin:0 auto 10px}
.note{font-size:13px;color:var(--mute);margin:10px 2px}
.rev{display:grid;grid-template-columns:1.4fr 1fr .7fr;gap:8px;padding:10px 14px;align-items:center;border-bottom:1px solid var(--line)}
.rev.low{background:var(--warn)}
input[type=text],input[type=date]{width:100%;font:inherit;color:var(--acc);background:#07030f;border:1px solid var(--line);border-bottom:2px solid var(--acc);border-radius:0;padding:8px}
.unit{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0;padding:14px;margin-top:12px}
svg polyline{filter:drop-shadow(0 0 4px var(--acc))}
svg circle{filter:drop-shadow(0 0 3px var(--pink))}
svg{width:100%;height:auto;display:block}
.tip{min-height:44px;margin-top:8px;font-size:15px}
.pt{cursor:pointer}
.empty{padding:24px;text-align:center;color:var(--mute)}
.del{background:none;border:1px solid var(--pink);color:var(--pink);font:inherit;font-size:13px;padding:6px 10px;cursor:pointer;letter-spacing:.04em}
.del.sure{background:var(--pink);color:#0a0612;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:inherit;font-size:13px;background:none;border:1px solid;padding:5px 10px;cursor:pointer}
.chip.off{opacity:.35;text-decoration:line-through}
</style>

.hud b{position:absolute;z-index:1;top:50%;width:26px;height:6px;margin-top:-3px;background:repeating-linear-gradient(90deg,#19ffd0 0 4px,transparent 4px 8px)}
.hud b:first-child{left:20px}.hud b:last-child{right:20px}
h1{display:inline-block;font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#ffe600;text-shadow:0 2px 0 #05030d,0 0 16px rgba(255,43,214,.5);margin:6px 0 6px;padding-bottom:5px;border-bottom:3px solid var(--pink)}
.list,.card{position:relative;background:var(--card);border:1px solid rgba(155,61,255,.55);border-left:3px solid var(--pink);border-radius:0;clip-path:none;box-shadow:0 0 22px rgba(155,61,255,.25)}
.list::before,.card::before,.list::after,.card::after{content:"";position:absolute;right:4px;width:12px;height:12px;pointer-events:none}
.list::before,.card::before{top:4px;border-top:2px solid var(--acc);border-right:2px solid var(--acc)}
.list::after,.card::after{bottom:4px;border-bottom:2px solid var(--pink);border-right:2px solid var(--pink)}
.btn{background:#ffe600;color:#07030f;text-shadow:none;letter-spacing:.1em;box-shadow:inset 0 -3px #ff2bd6}
.btn:hover{background:#fff35c}
.btn.ghost{clip-path:none;background:rgba(25,255,208,.06);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.btn:disabled{opacity:.4}
.row:hover{background:rgba(25,255,208,.08);box-shadow:inset 3px 0 var(--acc)}
.new{color:var(--acc);text-shadow:0 0 10px var(--acc)}
.head{color:var(--pink);text-shadow:0 0 8px var(--pink)}
.back{display:block;color:var(--pink)}
.sub,.note{text-shadow:0 0 6px #05030d,0 0 12px #05030d}
input[type=text],input[type=date]{background:rgba(3,2,12,.85);border-color:var(--line);border-bottom-color:var(--acc);color:var(--acc)}
.drop{border:0;background:linear-gradient(var(--acc),var(--acc)) 0 0/22px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) 0 0/2px 22px no-repeat,linear-gradient(var(--acc),var(--acc)) 100% 0/22px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) 100% 0/2px 22px no-repeat,linear-gradient(var(--acc),var(--acc)) 0 100%/22px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) 0 100%/2px 22px no-repeat,linear-gradient(var(--acc),var(--acc)) 100% 100%/22px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) 100% 100%/2px 22px no-repeat,rgba(10,6,24,.7);box-shadow:0 0 18px rgba(25,255,208,.15)}
.chip{background:rgba(255,255,255,.03);box-shadow:0 0 12px -3px currentColor}
.ret{width:120px;margin:14px auto}.ret svg{width:100%;filter:drop-shadow(0 0 6px #19ffd0)}
.ret .r1,.ret .r2{transform-box:fill-box;transform-origin:center;animation:sp 6s linear infinite}.ret .r2{animation-duration:3s;animation-direction:reverse}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ret .r1,.ret .r2{animation:none}}
svg circle{filter:drop-shadow(0 0 5px var(--pink))}svg polyline{filter:none}
.rw{grid-template-columns:1fr 1fr 34px;gap:6px 8px;align-items:center}
.rw>div{grid-column:1/-1}
.rw input{font-size:14px;padding:7px 6px;min-width:0}
.rw small{display:block;margin-top:3px;font-size:11px;color:var(--mute)}
.rw .x{padding:6px 0;text-align:center;border-color:var(--line);color:var(--mute)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.thumbs img{height:84px;border:1px solid var(--acc)}
#q{margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const DEFS=[
{k:'hgb',n:'Гемоглобин',u:'г/л',r:[130,170]},
{k:'glu',n:'Глюкоза',u:'ммоль/л',r:[3.9,5.9]},
{k:'chol',n:'Холестерин',u:'ммоль/л',r:[0,5.2]},
{k:'wbc',n:'Лейкоциты',u:'×10⁹/л',r:[4,9]},
{k:'fer',n:'Ферритин',u:'мкг/л',r:[30,400]},
{k:'tsh',n:'ТТГ',u:'мЕд/л',r:[0.4,4]},
{k:'rbc',n:'Эритроциты',u:'×10¹²/л',r:[4,5.5]},
{k:'plt',n:'Тромбоциты',u:'×10⁹/л',r:[150,400]},
{k:'alt',n:'АЛТ',u:'Ед/л',r:[0,41]},
{k:'ast',n:'АСТ',u:'Ед/л',r:[0,40]},
{k:'crea',n:'Креатинин',u:'мкмоль/л',r:[62,106]}];
const SEED=[
{date:'2026-03-12',v:{hgb:140,glu:5.0,chol:4.8,wbc:6.1,fer:62,tsh:2.1}},
{date:'2026-07-05',v:{hgb:136,glu:5.4,chol:5.1,wbc:6.8,fer:55,tsh:2.4}}];
const KEY='lab-proto-v1';
let data=load(),view='home',cur=null,draft=null,photo=null,delT=null,hid={};
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(SEED))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const $=s=>document.querySelector(s);
const fmt=n=>String(+n.toFixed(2)).replace('.',',');
const dt=s=>{const[a,b,c]=s.split('-');return c+'.'+b+'.'+a};
const app=$('#app');

function render(k){
 if(view!=='home')delT=null;
 if(view==='home')home();else if(view==='review')review();else if(view==='all')allv();else detail();
 app.insertAdjacentHTML('afterbegin','<div class="hud"><b></b><span>BIO<em>SCAN</em> // 2077</span><b></b></div>');
 if(!k)window.scrollTo(0,0);
}
function home(){
 const s=[...data].sort((a,b)=>a.date<b.date?-1:1);
 const last=s[s.length-1],prev=s[s.length-2];
 let h=`<h1>Мои анализы</h1><p class="sub">${s.length?`// последний скан: ${dt(last.date)}`:'Пока нет анализов'}</p>
 <button class="btn" id="add">Добавить анализ по фото</button>${s.length>1?`<button class="btn ghost" id="all" style="margin-top:10px">Общий график</button>`:''}`;
 if(!last){h+=`<div class="list"><div class="empty">Сфотографируйте бланк, и здесь появятся показатели.</div></div>`}
 else{
  h+=`${DEFS.filter(d=>last.v[d.k]!=null).length>10?'<input type="text" id="q" placeholder="Поиск показателя" aria-label="Поиск показателя">':''}<div class="list"><div class="head"><span>Показатель</span><span>Было</span><span>Стало</span><span>Изменение</span></div>`;
  DEFS.forEach(d=>{
   const n=last.v[d.k];if(n==null)return;
   const o=prev?prev.v[d.k]:null;
   let ch='<span class="d" style="color:var(--mute)">нет данных</span>';
   if(o!=null){const df=n-o,p=o?df/o*100:0;
    const ar=Math.abs(df)<1e-9?'→':df>0?'↑':'↓';
    ch=`<span class="d"><b>${ar} ${df>0?'+':''}${fmt(df)}</b><br>${p>0?'+':''}${fmt(p)}%</span>`}
   h+=`<button class="row" data-k="${d.k}" data-n="${h2(d.n.toLowerCase())}"><span class="name">${h2(d.n)}<small>${h2(d.u||'')}</small></span><span class="old">${o!=null?fmt(o):'—'}</span><span class="new">${fmt(n)}</span>${ch}</button>`});
  h+=`</div><p class="note">Нажмите на показатель, чтобы увидеть график. Приложение ничего не оценивает, только показывает динамику.</p><h1 style="font-size:20px;margin-top:24px">История</h1><div class="list">${[...s].reverse().map(a=>`<div class="rev" style="grid-template-columns:1fr auto"><span>${dt(a.date)}<small class="unit"> — ${Object.keys(a.v).length} показателей</small></span><button class="del${delT===a.date?' sure':''}" data-d="${a.date}">${delT===a.date?'Точно удалить?':'Удалить'}</button></div>`).join('')}</div>`}
 app.innerHTML=h;
 $('#add').onclick=()=>{photo=null;draft=null;view='review';render()};
 const q=$('#q');if(q)q.oninput=()=>{const t=q.value.trim().toLowerCase();document.querySelectorAll('.row').forEach(b=>{b.style.display=!t||b.dataset.n.includes(t)?'':'none'})};
 const al=$('#all');if(al)al.onclick=()=>{view='all';render()};
 document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(delT===b.dataset.d){data=data.filter(a=>a.date!==b.dataset.d);delT=null;save()}else delT=b.dataset.d;render(1)});
 document.querySelectorAll('.row').forEach(b=>b.onclick=()=>{cur=b.dataset.k;view='detail';render()});
}
/*P*/
const SYN={hgb:['гемоглоб','hgb','hb','hemoglobin','haemoglobin'],glu:['глюкоз','glucose','glu'],chol:['холестер','cholesterol','chol'],wbc:['лейкоцит','wbc','leu'],fer:['феррит','ferritin'],tsh:['ттг','тиреотроп','tsh'],rbc:['эритроцит','rbc'],plt:['тромбоцит','plt'],alt:['алт','аланин','alt'],ast:['аст','аспартат','ast'],crea:['креатинин','creatinine']};
const BAD=/средн|mch|mcv|rdw|mpv|pdw|гематокрит|формул|ширин|распределен|гликир|гликозил|hba|a1c|лпнп|лпвп|лпонп|ldl|hdl|vldl|липопротеин|клиренс|скф|gfr|киназ|моч|urin|кал|слюн/;
const esc=s=>s.replace(/[.*+?^$()|[\]\\{}]/g,'\\$&');
const RX={};DEFS.forEach(d=>{RX[d.k]=new RegExp('(^|[^a-zа-яё0-9])('+SYN[d.k].map(s=>esc(s)+(s.length<=4?'(?![a-zа-яё])':'')).join('|')+')','i')});
function today(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function findDate(text){
 const now=new Date(),re=/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/g;let key=null,best=null;
 text.split(/\r?\n/).forEach(l=>{const kw=/взят|забор|получен|сдач|исслед|collect/i.test(l);let m;re.lastIndex=0;
  while((m=re.exec(l))){const dd=+m[1],mm=+m[2],yy=+m[3];if(mm<1||mm>12||dd<1||dd>31||yy<2000||yy>now.getFullYear())continue;
   const iso=yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');if(iso>today())continue;
   if(kw&&!key)key=iso;if(!best||iso>best)best=iso}});
 return key||best}
const h2=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nu=s=>String(s||'').toLowerCase().replace(/[\s×x*^·.]/g,'').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c));
const num=x=>parseFloat(String(x).replace(',','.'));
const SKIP=/возраст|телефон|дата|номер|страниц|врач|проб[аы]|заказ|инн|огрн|лиценз|рождени|паспорт|адрес|индекс|заявк|№|время|страна|стр\.|пациент|кабинет|страх|полис|сайт|www|http/i;
const UNIT_OK=t=>{const l=t.toLowerCase();return l==='%'||(/\//.test(t)&&t.length<=16&&!/^\d/.test(t))||/^[×x]?10[\^⁰¹²³⁴⁵⁶⁷⁸⁹0-9]/.test(l)||['фл','пг','fl','pg','мм'].includes(l)};
function lineToRow(raw){
 const line=raw.replace(/[|_\[\]{}]/g,' ').replace(/^\s*\d+[.)]\s+/,'').replace(/\s+/g,' ').trim();
 if(line.length<5)return null;
 const tk=line.split(' ');let i=-1;
 for(let j=1;j<tk.length;j++){if(/^[<>≤≥]?\d+(?:[.,]\d+)?$/.test(tk[j])&&/[a-zа-яё].*[a-zа-яё]/i.test(tk.slice(0,j).join(' '))){i=j;break}}
 if(i<0)return null;
 const name=tk.slice(0,i).join(' ').replace(/[:;,.\s]+$/,'').replace(/^[-•*·\s]+/,'');
 if(name.length<2||name.length>60||SKIP.test(name))return null;
 const rest=tk.slice(i+1);let u='';
 if(rest[0]&&UNIT_OK(rest[0])){u=rest[0];if(/^[×x]?10[\^⁰¹²³⁴⁵⁶⁷⁸⁹0-9]*$/i.test(u)&&rest[1]&&/^\//.test(rest[1]))u+=rest[1]}
 const rs=rest.join(' ');let r=null,m=/(\d+(?:[.,]\d+)?)\s*[-–—]\s*(\d+(?:[.,]\d+)?)/.exec(rs);
 if(m)r=[num(m[1]),num(m[2])];else if((m=/(?:<|≤|до)\s*(\d+(?:[.,]\d+)?)/i.exec(rs)))r=[0,num(m[1])];
 if(r&&!(r[0]<r[1]))r=null;
 if(!u&&!r)return null;
 return{n:name,val:num(tk[i].replace(/[<>≤≥]/,'')),u,r}}
function keyFor(name){
 const c=name.toLowerCase();
 if(!BAD.test(c)){for(const d of DEFS){if(RX[d.k]&&RX[d.k].test(c))return d.k}}
 const k=c.replace(/\([^)]*\)/g,' ').replace(/[^a-zа-яё0-9%+]+/g,' ').trim().replace(/ /g,'_');
 return 'c:'+(k||c.replace(/\W+/g,'')||'x')}
function parseText(text){
 const rows=[],seen={};
 text.split(/\r?\n/).forEach(raw=>{const r=lineToRow(raw);if(!r||isNaN(r.val))return;
  r.k=keyFor(r.n);if(seen[r.k])return;seen[r.k]=1;
  const d=DEFS.find(x=>x.k===r.k);
  if(d){r.n=d.n;if(!r.u)r.u=d.u;if(r.u&&d.u&&nu(r.u)!==nu(d.u))r.unitWarn=d.u}
  const rr=(d&&d.r)||r.r;r.flag=!!(rr&&(r.val>rr[1]*3||(rr[0]>0&&r.val<rr[0]*.3)));
  r.vt=fmt(r.val);rows.push(r)});
 return{date:findDate(text)||today(),rows,raw:text}}
const IK='lab-ind-v1';
function loadInd(){try{JSON.parse(localStorage.getItem(IK)||'[]').forEach(x=>{if(!DEFS.some(d=>d.k===x.k))DEFS.push(x)})}catch(e){}}
function saveInd(){try{localStorage.setItem(IK,JSON.stringify(DEFS.filter(d=>d.k.startsWith('c:'))))}catch(e){}}
/*PE*/
async function ocr(src,say){
 if(!window.Tesseract)throw new Error('lib');
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
 const sc=Math.min(2,2200/Math.max(img.width,img.height));
 const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
 const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
 const id=x.getImageData(0,0,c.width,c.height),p=id.data,h=new Array(256).fill(0);
 for(let i=0;i<p.length;i+=4){const g=Math.round(.299*p[i]+.587*p[i+1]+.114*p[i+2]);p[i]=g;h[g]++}
 const tot=p.length/4;let a=0,lo=0,hi=255;
 for(let i=0;i<256;i++){a+=h[i];if(a>tot*.02){lo=i;break}}
 a=0;for(let i=255;i>=0;i--){a+=h[i];if(a>tot*.02){hi=i;break}}
 const k=255/Math.max(1,hi-lo);
 for(let i=0;i<p.length;i+=4){const g=Math.max(0,Math.min(255,(p[i]-lo)*k));p[i]=p[i+1]=p[i+2]=g}
 x.putImageData(id,0,0);
 const r=await Tesseract.recognize(c,'rus+eng',{logger:m=>{say(m.status==='recognizing text'?'Распознавание: '+Math.round(m.progress*100)+'%':'Загрузка модели, подождите…')}});
 return r.data.text}
function syncDraft(){
 const dd=$('#dd');if(dd)draft.date=dd.value;
 document.querySelectorAll('.rw').forEach(el=>{const r=draft.rows[+el.dataset.i];if(!r)return;r.n=el.querySelector('.nm').value;r.vt=el.querySelector('.vl').value;r.u=el.querySelector('.un').value})}
function review(){
 const ph=photo||[];
 let h=`<button class="back" id="bk">← Назад</button><h1>Новый анализ</h1>`;
 if(!draft){
  h+=`<p class="sub">Сфотографируйте бланк ровно и при хорошем свете. Если бланк на нескольких страницах, выберите все фото сразу или добавляйте по очереди.</p>
  ${ph.length?`<div class="thumbs">${ph.map(p=>`<img src="${p}" alt="Фото бланка">`).join('')}</div>`:''}
  <label class="drop" for="f"><span>${ph.length?'Добавить ещё фото':'Нажмите, чтобы сделать фото или выбрать файлы'}</span></label>
  <input id="f" type="file" accept="image/*" multiple hidden>
  <button class="btn" id="rec" style="margin-top:12px"${ph.length?'':' disabled'}>Распознать</button>
  ${ph.length?'<button class="btn ghost" id="clr" style="margin-top:10px">Убрать фото</button>':''}
  <button class="btn ghost" id="man" style="margin-top:10px">Ввести вручную</button>
  <div class="ret" id="rt" hidden><svg viewBox="0 0 100 100"><circle class="r1" cx="50" cy="50" r="44" fill="none" stroke="#ff2bd6" stroke-width="2" stroke-dasharray="40 14 8 14"/><circle class="r2" cx="50" cy="50" r="33" fill="none" stroke="#19ffd0" stroke-width="3" stroke-dasharray="20 10"/><circle cx="50" cy="50" r="18" fill="none" stroke="#19ffd0" stroke-width="1.5"/><circle cx="50" cy="50" r="6" fill="#ff2bd6"/></svg></div>
  <div class="tip" id="st" style="text-align:center"></div>
  <p class="note">Приложение забирает все строки бланка: показатель, значение, единицы и референс. Текст читается прямо на телефоне. При первом запуске скачивается языковая модель (несколько МБ), нужен интернет. Фото и анализы никуда не отправляются.</p>`;
 }else{
  const n=draft.rows.length;
  h+=`<p class="sub">${n?`Найдено строк: ${n}. Проверьте названия и значения, лишние строки уберите крестиком.`:'Ничего не найдено. Добавьте показатели вручную или сфотографируйте бланк ровнее.'}</p>
  <div class="card" style="margin-top:0"><label class="unit" for="dd">Дата сдачи</label><input type="date" id="dd" value="${draft.date}"></div>
  <div class="list" style="margin-top:12px">${draft.rows.map((r,i)=>`<div class="rev rw ${r.flag?'low':''}" data-i="${i}"><div><input type="text" class="nm" value="${h2(r.n)}" placeholder="Название" aria-label="Название"><small>${[r.r?'реф. '+fmt(r.r[0])+'–'+fmt(r.r[1]):'',r.flag?'проверьте':'',r.unitWarn?'в истории: '+h2(r.unitWarn):''].filter(Boolean).join(' · ')}</small></div><input type="text" class="vl" inputmode="decimal" value="${h2(r.vt)}" placeholder="—" aria-label="Значение"><input type="text" class="un" value="${h2(r.u||'')}" placeholder="ед." aria-label="Единицы"><button class="del x" data-x="${i}" aria-label="Убрать строку">✕</button></div>`).join('')}</div>
  <button class="btn ghost" id="addr" style="margin-top:12px">+ Добавить показатель</button>
  ${draft.raw?`<details class="note"><summary>Что прочитано с фото</summary><pre style="white-space:pre-wrap;font-size:12px">${h2(draft.raw)}</pre></details>`:''}
  <button class="btn" id="sv" style="margin-top:16px">Сохранить анализ</button>`;
 }
 app.innerHTML=h;
 $('#bk').onclick=()=>{draft=null;photo=null;view='home';render()};
 const f=$('#f');
 if(f)f.onchange=e=>{const fs=[...e.target.files];if(!fs.length)return;
  Promise.all(fs.map(file=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)}))).then(a=>{photo=(photo||[]).concat(a);render(1)})};
 const cl=$('#clr');if(cl)cl.onclick=()=>{photo=null;render(1)};
 const rc=$('#rec');
 if(rc&&ph.length)rc.onclick=async()=>{rc.disabled=true;$('#rt').hidden=false;const st=$('#st');
  try{let txt='';for(let i=0;i<ph.length;i++){txt+=await ocr(ph[i],t=>{st.textContent=(ph.length>1?`Фото ${i+1} из ${ph.length}. `:'')+t})+'\n'}
   draft=parseText(txt);render()}
  catch(e){st.textContent='Не удалось прочитать фото. Проверьте интернет и попробуйте ещё раз или введите значения вручную.';rc.disabled=false;$('#rt').hidden=true}};
 const mn=$('#man');if(mn)mn.onclick=()=>{draft={date:today(),rows:[{n:'',vt:'',u:'',r:null}],raw:''};render()};
 const ad=$('#addr');if(ad)ad.onclick=()=>{syncDraft();draft.rows.push({n:'',vt:'',u:'',r:null});render(1)};
 document.querySelectorAll('.x').forEach(b=>b.onclick=()=>{syncDraft();draft.rows.splice(+b.dataset.x,1);render(1)});
 const sv=$('#sv');
 if(sv)sv.onclick=()=>{
  syncDraft();const v={};let bad=false,added=false;
  draft.rows.forEach(r=>{const nm=(r.n||'').trim(),t=(r.vt||'').trim();if(!nm&&!t)return;
   const n=num(t);if(!nm||isNaN(n)){bad=true;return}
   const k=keyFor(nm);let d=DEFS.find(x=>x.k===k);
   if(!d){d={k,n:nm,u:(r.u||'').trim(),r:r.r||null};DEFS.push(d);added=true}
   else if(k.startsWith('c:')){if(!d.r&&r.r){d.r=r.r;added=true}if(!d.u&&r.u){d.u=r.u.trim();added=true}}
   v[k]=n});
  if(bad){alert('Проверьте строки: у каждой нужны название и число, например 5,4. Лишние строки уберите крестиком.');return}
  if(!Object.keys(v).length){alert('Добавьте хотя бы один показатель');return}
  if(added)saveInd();
  data=data.filter(a=>a.date!==draft.date);
  data.push({date:draft.date,v});save();draft=null;photo=null;view='home';render()};
}
function allv(){
 const s=[...data].sort((a,b)=>a.date<b.date?-1:1);
 if(s.length<2){view='home';return home()}
 const COL=['#19ffd0','#ff2bd6','#ffe600','#9b3dff','#2a6bff','#ff7a1a','#ffffff','#ff5470','#7cffcb','#c0ff3e','#4d9bff'];
 const W=340,H=240,pl=54,pr=14,pt=14,pb=28;
 const ser=DEFS.map(d=>{const b=s.find(a=>a.v[d.k]!=null);return{d,b:b?b.v[d.k]:null}}).filter(x=>x.b);ser.forEach((x,i)=>{x.c=COL[i%COL.length];x.off=hid[x.d.k]===undefined?i>=5:hid[x.d.k]});
 const pct=(x,a)=>a.v[x.d.k]==null?null:(a.v[x.d.k]-x.b)/x.b*100;
 const vis=ser.filter(x=>!x.off);
 const all=[0];vis.forEach(x=>s.forEach(a=>{const p=pct(x,a);if(p!=null)all.push(p)}));
 let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*.15||5;lo-=pad;hi+=pad;
 const t=x=>new Date(x).getTime(),t0=t(s[0].date),t1=t(s[s.length-1].date);
 const X=a=>pl+(t(a)-t0)/(t1-t0)*(W-pl-pr);
 const Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 let g=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)" stroke-dasharray="4 4"/>`;
 for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#3a1f6e" stroke-dasharray="2 5"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--mute)">${fmt(v)}%</text>`}
 s.forEach(a=>{g+=`<text x="${X(a.date)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mute)">${dt(a.date).slice(0,5)}</text>`});
 vis.forEach(x=>{const pts=s.map((a,i)=>({a,i,p:pct(x,a)})).filter(o=>o.p!=null);
  g+=`<polyline fill="none" stroke="${x.c}" stroke-width="2.6" stroke-linejoin="round" points="${pts.map(o=>X(o.a.date)+','+Y(o.p)).join(' ')}" style="filter:drop-shadow(0 0 7px ${x.c})"/>`;
  pts.forEach(o=>{g+=`<circle class="pt" tabindex="0" data-i="${o.i}" cx="${X(o.a.date)}" cy="${Y(o.p)}" r="5" fill="#060818" stroke="${x.c}" stroke-width="2.5"/>`})});
 app.innerHTML=`<button class="back" id="bk">← Назад</button><h1>Общий график</h1><p class="sub">Изменение каждого показателя в % относительно первого анализа. Единицы разные, поэтому сравниваются изменения, а не сами значения.</p>
 <div class="card"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Общий график">${g}</svg><div class="tip" id="tip"></div></div>
 <div class="chips">${ser.map(x=>`<button class="chip${x.off?' off':''}" data-k="${x.d.k}" style="border-color:${x.c};color:${x.c}">${h2(x.d.n)}</button>`).join('')}</div>`;
 const tip=i=>{const a=s[i];$('#tip').innerHTML=`<b>${dt(a.date)}</b><br>`+(vis.map(x=>{const p=pct(x,a);return p==null?'':`<span style="color:${x.c}">${h2(x.d.n)}</span> ${fmt(a.v[x.d.k])} ${x.d.u} (${p>0?'+':''}${fmt(p)}%)`}).filter(Boolean).join('<br>')||'Выберите показатели ниже')};
 tip(s.length-1);
 document.querySelectorAll('.pt').forEach(c=>{c.onclick=()=>tip(+c.dataset.i);c.onkeydown=e=>{if(e.key==='Enter')tip(+c.dataset.i)}});
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const x=ser.find(z=>z.d.k===b.dataset.k);hid[x.d.k]=!x.off;render(1)});
 $('#bk').onclick=()=>{view='home';render()};
}
function detail(){
 const d=DEFS.find(x=>x.k===cur);
 const s=[...data].filter(a=>a.v[d.k]!=null).sort((a,b)=>a.date<b.date?-1:1);
 const W=340,H=200,pl=36,pr=14,pt=14,pb=28;
 const vals=s.map(a=>a.v[d.k]);
 const R=d.r||[vals[0],vals[0]];let lo=Math.min(...vals,R[0]),hi=Math.max(...vals,R[1]);
 const pad=(hi-lo)*.15||1;lo-=pad;hi+=pad;if(lo<0&&Math.min(...vals,R[0])>=0)lo=0;
 const t=x=>new Date(x).getTime();
 const t0=t(s[0].date),t1=t(s[s.length-1].date);
 const X=a=>s.length===1||t1===t0?(pl+W-pr)/2:pl+(t(a)-t0)/(t1-t0)*(W-pl-pr);
 const Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 const by=Y(Math.min(R[1],hi)),bh=Y(Math.max(R[0],lo))-by;
 let g=`<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19ffd0" stop-opacity=".5"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient><linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="${pl}" x2="${W-pr}" y1="0" y2="0"><stop offset="0" stop-color="#ff2bd6"/><stop offset="1" stop-color="#19ffd0"/></linearGradient></defs>${d.r?`<rect x="${pl}" y="${by}" width="${W-pl-pr}" height="${bh}" fill="var(--band)"/>`:''}`;
 for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#3a1f6e" stroke-dasharray="2 5"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--mute)">${fmt(v)}</text>`}
 const lp=s.map(a=>X(a.date)+','+Y(a.v[d.k])).join(' ');g+=`<polygon fill="url(#ar)" points="${lp} ${X(s[s.length-1].date)},${H-pb} ${X(s[0].date)},${H-pb}"/><polyline fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px #19ffd0)" points="${lp}"/>`;
 s.forEach((a,i)=>{g+=`<text x="${X(a.date)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mute)">${dt(a.date).slice(0,5)}</text>
 <circle class="pt" tabindex="0" data-i="${i}" cx="${X(a.date)}" cy="${Y(a.v[d.k])}" r="7" fill="#060818" stroke="#fff" stroke-width="2.5"/>`});
 const li=s.length-1;
 app.innerHTML=`<button class="back" id="bk">← Назад</button><h1>${h2(d.n)}</h1><p class="sub">${h2(d.u||'')}${d.r?`. Розовая зона: референс из бланка ${fmt(d.r[0])}–${fmt(d.r[1])}`:'. Референс не указан'}</p>
 <div class="card"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График ${h2(d.n)}">${g}</svg><div class="tip" id="tip"></div></div>
 <div class="list" style="margin-top:12px">${[...s].reverse().map((a,i,arr)=>{const p=arr[i+1];const df=p?a.v[d.k]-p.v[d.k]:null;return `<div class="rev" style="grid-template-columns:1fr 1fr 1fr"><span>${dt(a.date)}</span><b>${fmt(a.v[d.k])}</b><span class="unit">${df==null?'первый':(df>0?'↑ +':df<0?'↓ ':'→ ')+fmt(df)}</span></div>`}).join('')}</div>`;
 const tip=(i)=>{const a=s[i],p=s[i-1];let x=`<b>${dt(a.date)}</b>: ${fmt(a.v[d.k])} ${d.u}`;
  if(p){const df=a.v[d.k]-p.v[d.k];x+=`<br>Было ${fmt(p.v[d.k])}, стало ${fmt(a.v[d.k])} (${df>0?'+':''}${fmt(df)})`}
  $('#tip').innerHTML=x};
 tip(li);
 document.querySelectorAll('.pt').forEach(c=>{c.onclick=()=>tip(+c.dataset.i);c.onkeydown=e=>{if(e.key==='Enter')tip(+c.dataset.i)}});
 $('#bk').onclick=()=>{view='home';render()};
}
loadInd();render();
</script>
